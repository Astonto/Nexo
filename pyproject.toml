[project]
name = "nexo"
version = "1.6.18"
description = "Grabador de macros y autoclicker local para Windows"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2", "pynput==1.8.2", "comtypes==1.4.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["windows: requires a Windows desktop", "integration: isolated integration test"]
